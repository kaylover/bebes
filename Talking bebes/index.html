  :root{
    --claret: #670626;
    --claret-deep: #4c041c;
    --pink: #FFBDC5;
    --pink-soft: #ffd2d9;
    --font-display: 'Baloo 2', 'Fredoka', 'Arial Rounded MT Bold', sans-serif;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    height: 100%;
    margin: 0;
    font-family: var(--font-display);
    overflow: hidden;
    background: #ffd0d9;
  }

  #stage{
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    overflow: hidden;
  }

  /* ---------- DECK (gives the tabletop / stack illusion) ---------- */
  #deckWrap{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1200px;
    opacity: 0;
    transform: scale(0.4) translateY(18%);
    transition: opacity .4s ease, transform .55s cubic-bezier(.22,1.4,.4,1);
    pointer-events: none;
  }
  #deckWrap.revealed{
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  /* ---------- CARD BOX (closed deck) ---------- */
  #boxWrap{
    position: absolute;
    inset: 0;
    z-index: 40;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    cursor: pointer;
  }

  .card-box{
    position: relative;
    width: min(78vw, 320px);
    aspect-ratio: 5 / 8;
    max-height: 84vh;
    max-height: 84dvh;
    perspective: 900px;
  }

  .box-ground-shadow{
    position: absolute;
    bottom: -5%;
    left: 50%;
    width: 82%;
    height: 8%;
    transform: translateX(-50%);
    display: none;
  }

  .box-base{
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 78%;
    background: var(--pink);
    border-radius: 10px 10px 20px 20px;
    overflow: hidden;
    transition: transform .55s cubic-bezier(.55,0,.85,1) .35s;
  }

  .box-base-inner{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 0;
    padding: 10% 6% 8%;
  }

  .box-top{
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .box-lid{
    position: absolute;
    top: 0;
    left: 50%;
    width: 106%;
    height: 25%;
    background: var(--pink);
    border-radius: 14px 14px 8px 8px;
    overflow: hidden;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    transition: transform .5s cubic-bezier(.4,0,.2,1);
    backface-visibility: hidden;
  }

  /* thin dark seam under the lid, where it meets the box */
  .box-lid::after{
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 8%;
    background: rgba(103,6,38,0.18);
  }

  /* ---------- box opening sequence ---------- */
  .card-box.opening .box-lid{
    /* opens backward on its hinge until it faces away and disappears */
    transform: translateX(-50%) rotateX(165deg) translateY(-4%);
  }
  .card-box.opening .box-base{
    /* the box itself physically drops out of view, no fading */
    transform: translateY(160%) scale(0.96);
  }
  .card-box.opening .box-ground-shadow{
    opacity: 0;
  }

  .box-label{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(38px, 15vw, 62px);
    text-transform: uppercase;
    letter-spacing: -2px;
    line-height: 0.85;
    color: var(--claret);
    -webkit-text-stroke: 1.5px var(--claret);
    text-align: center;
    width: 100%;
  }

  .box-subtitle-svg{
    display: block;
    width: 70%;
    max-width: 220px;
    margin-top: 14px;
    overflow: visible;
  }
  .box-subtitle-svg text{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    fill: var(--claret);
  }

  .box-illustration{
    display: block;
    width: 70%;
    max-width: 210px;
    height: auto;
    margin-top: 6%;
  }

  .box-stats{
    position: absolute;
    left: 6%;
    bottom: 6%;
    display: inline-block;
    text-align: center;
    line-height: 1;
  }
  .box-stats-line1{
    display: block;
    white-space: nowrap;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(12px, 3.6vw, 15px);
    text-transform: uppercase;
    letter-spacing: -0.5px;
    color: var(--claret);
    -webkit-text-stroke: 0.5px currentColor;
    line-height: 0.9;
  }
  .box-stats-line2{
    display: block;
    width: 100%;
    text-align: justify;
    text-align-last: justify;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(7px, 1.8vw, 8.5px);
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--claret);
    opacity: 0.75;
  }

  .box-hint{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--claret);
    opacity: 0.75;
    transition: opacity .2s ease;
  }
  .box-hint.hidden{
    opacity: 0;
  }

  /* ---------- CARD ---------- */
  .card{
    position: absolute;
    top: 50%;
    left: 50%;
    width: min(78vw, 320px);
    aspect-ratio: 5 / 8;
    max-height: 84vh;
    max-height: 84dvh;
    border-radius: 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 7% 8% 6%;
    cursor: pointer;
    user-select: none;
    transform: translate(-50%,-50%);
    transition: transform .3s ease;
    will-change: transform;
  }
  .card.claret{ background: var(--claret); }
  .card.pink{ background: var(--pink); }

  .logo{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(15px, 3.4vw, 18px);
    letter-spacing: -1px;
    text-transform: uppercase;
    line-height: 0.85;
    text-align: center;
    -webkit-text-stroke: 0.6px currentColor;
  }

  .question-wrap{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4% 2px;
    min-height: 0;
  }

  .question{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(14px, 3.9vw, 19px);
    line-height: 1.32;
    white-space: pre-line;
  }

  .card.rules-mode .question{
    font-size: clamp(11.5px, 3vw, 14.5px);
    line-height: 1.55;
    text-align: left;
    font-weight: 600;
  }

  .footer{
    text-align: center;
  }
  .category{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(9px, 2vw, 11px);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .counter{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(7px, 1.6vw, 9px);
    opacity: 0.75;
  }

  .card.claret .logo,
  .card.claret .question,
  .card.claret .category,
  .card.claret .counter{ color: var(--pink); }

  .card.pink .logo,
  .card.pink .question,
  .card.pink .category,
  .card.pink .counter{ color: var(--claret); }



  /* ---------- BUTTONS ---------- */
  .btn{
    position: absolute;
    z-index: 20;
    border: none;
    cursor: pointer;
    font-family: var(--font-display);
    background: var(--pink-soft);
    color: var(--claret);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .15s ease;
  }
  .btn:hover{ transform: translateY(-2px); }
  .btn:active{ transform: translateY(0px) scale(0.96); }
  .btn.pre-open{ opacity: 0; pointer-events: none; }

  #rulesBtn{
    top: calc(20px + env(safe-area-inset-top));
    right: calc(20px + env(safe-area-inset-right));

      "When you overthink, what do you wish I did?",
      "What reassurance actually helps—and what doesn't?",
      "What's a fear you know isn't rational but still feels real?",
      "How can I help without trying to \"fix\" everything?"
    ]},
    { name: "Trust & Safety", dark: false, questions: [
      "When do you feel safest with me?",
      "What's something that would strengthen your trust in me?",
      "Have I ever unintentionally broken your trust?",
      "What makes you feel emotionally secure?",
      "How do you know you can rely on someone?"
    ]},
    { name: "Self-Awareness", dark: false, questions: [
      "What's something about yourself you're still trying to understand?",
      "What's a habit you wish you could change?",
      "What emotion is hardest for you to express?",
      "What do you think your biggest blind spot is?",
      "What's something you've learned about yourself through this relationship?"
    ]},
    { name: "Appreciation", dark: false, questions: [
      "What's something I do that deserves more appreciation?",
      "What's a memory that reminds you why we're together?",
      "What quality in me do you admire most?",
      "When do you feel proud of us?",
      "What makes our relationship unique?"
    ]},
    { name: "Future", dark: false, questions: [
      "What kind of relationship do you dream of five years from now?",
      "What tradition would you like us to create?",
      "What challenge do you think we'll overcome together?",
      "What does \"growing old together\" look like to you?",
      "What do you hope never changes about us?"
    ]}
  ];

  // Flatten into individual card objects
  let deck = [];
  RAW_CATEGORIES.forEach(cat => {
    cat.questions.forEach(q => {
      deck.push({ category: cat.name, text: q, dark: false, assignment: false });
    });
  });

  // Fisher-Yates shuffle
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }

  // Rules card, always first
  deck.unshift({
    category: "Rules",
    text: "1. Answer questions honestly \u2014 otherwise you're not working toward a better us.\n\n2. Try to answer without attacking the other.\n\n3. Don't take answers too personally \u2014 instead try to understand the other's perspective.\n\n4. Let the other finish before trying to explain your side of the story.",
    dark: true,
    isRules: true
  });

  // Final assignment card, always last
  deck.push({
    category: "Final Assignment",
    text: "Together, write down a few rules or agreements for a healthier \u201cus\u201d \u2014 things you both want to hold each other to going forward.",
    dark: true,
    assignment: true
  });

  const boxWrap = document.getElementById('boxWrap');
  const deckWrap = document.getElementById('deckWrap');
  const cardEl = document.getElementById('card');
  const questionText = document.getElementById('questionText');
  const categoryText = document.getElementById('categoryText');
  const counterText = document.getElementById('counterText');

  let index = 0;
  let animating = false;
  let returnIndex = null; // where to resume after viewing the Rules card mid-deck

  function fillContent(item, position, total){
    const catLabel = item.assignment ? '❤ Final Assignment' : (item.isRules ? 'Rules' : item.category.toUpperCase());
    questionText.textContent = item.text;
    categoryText.textContent = catLabel;
    counterText.textContent = position + ' / ' + total;
    cardEl.classList.toggle('claret', !!item.dark);
    cardEl.classList.toggle('pink', !item.dark);
    cardEl.classList.toggle('rules-mode', !!item.isRules);
  }

  function updatePrevState(){
    prevBtn.disabled = index === 0;
  }

  const OFFSCREEN_RIGHT = 'translate(-50%,-50%) translate(130%, -12%) rotate(16deg)';

  function goNext(){
    if (animating || index >= deck.length - 1) return;
    animating = true;
    cardEl.style.pointerEvents = 'none';

    // fly the current card off screen to the right
    cardEl.style.transition = 'transform .32s cubic-bezier(.5,0,.85,1)';
    cardEl.style.transform = OFFSCREEN_RIGHT;

    const onFlyOut = (e) => {
      if (e.propertyName !== 'transform') return;
      cardEl.removeEventListener('transitionend', onFlyOut);

      index++;
      fillContent(deck[index], index + 1, deck.length);
      updatePrevState();

      // snap small, as if it's the next card sitting on the stack
      cardEl.style.transition = 'none';
      cardEl.style.transform = 'translate(-50%,-50%) scale(0.93) translateY(10px) rotate(-3deg)';
      void cardEl.offsetWidth; // force reflow

      requestAnimationFrame(() => {
        cardEl.style.transition = 'transform .28s cubic-bezier(0,0,.3,1)';
        cardEl.style.transform = 'translate(-50%,-50%) scale(1) translateY(0) rotate(0deg)';
        cardEl.addEventListener('transitionend', onSettle, { once: true });
      });
    };
    cardEl.addEventListener('transitionend', onFlyOut);
  }

  function goPrev(){
    jumpToIndex(index - 1);
  }

  // Jumps straight to any card in the deck (used for "prev" and for
  // bringing the Rules card back when the Rules button is tapped) —
  // snap off screen to the right, then slide the new card back in.
  function jumpToIndex(newIndex){
    if (animating || newIndex === index || newIndex < 0 || newIndex > deck.length - 1) return;
    animating = true;
    cardEl.style.pointerEvents = 'none';

    index = newIndex;
    fillContent(deck[index], index + 1, deck.length);
    updatePrevState();

    cardEl.style.transition = 'none';
    cardEl.style.transform = OFFSCREEN_RIGHT;
    void cardEl.offsetWidth; // force reflow

    requestAnimationFrame(() => {
      cardEl.style.transition = 'transform .32s cubic-bezier(0,0,.3,1)';
      cardEl.style.transform = 'translate(-50%,-50%) scale(1) translateY(0) rotate(0deg)';
      cardEl.addEventListener('transitionend', onSettle, { once: true });
    });
  }

  function onSettle(e){
    if (e.propertyName !== 'transform') return;
    cardEl.style.pointerEvents = '';
    animating = false;
  }

  // Dismissing the Rules card: it just flies away on its own — the card
  // you were on is revealed already sitting in place, with no separate
  // "sliding back in" motion.
  function closeRulesCard(){
    if (animating) return;
    animating = true;
    cardEl.style.pointerEvents = 'none';

    cardEl.style.transition = 'transform .32s cubic-bezier(.5,0,.85,1)';
    cardEl.style.transform = OFFSCREEN_RIGHT;

    const onFlyOut = (e) => {
      if (e.propertyName !== 'transform') return;
      cardEl.removeEventListener('transitionend', onFlyOut);

      const target = returnIndex;
      returnIndex = null;
      index = target;
      fillContent(deck[index], index + 1, deck.length);
      updatePrevState();

      // snap straight to resting position — no incoming slide
      cardEl.style.transition = 'none';
      cardEl.style.transform = 'translate(-50%,-50%)';
      void cardEl.offsetWidth; // force reflow

      cardEl.style.pointerEvents = '';
      animating = false;
    };
    cardEl.addEventListener('transitionend', onFlyOut);
  }

  function onCardTap(){
    if (index === 0 && returnIndex !== null){
      closeRulesCard();
      return;
    }
    goNext();
  }

  cardEl.addEventListener('click', onCardTap);

  prevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    goPrev();
  });

  rulesBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (index !== 0) { returnIndex = index; } // remember where we were
    jumpToIndex(0); // bring the Rules card back
  });

  // ---------- CARD BOX OPENING ----------
  let boxOpened = false;
  const cardBox = boxWrap.querySelector('.card-box');
  const boxHint = boxWrap.querySelector('.box-hint');

  function openBox(){
    if (boxOpened) return;
    boxOpened = true;
    boxWrap.style.pointerEvents = 'none';

    if (boxHint) boxHint.classList.add('hidden');

    // 1) the lid tilts open
    cardBox.classList.add('opening');

    // 2) the cards pop out from inside, right as the lid lifts
    setTimeout(() => {
      deckWrap.classList.add('revealed');
      rulesBtn.classList.remove('pre-open');
      prevBtn.classList.remove('pre-open');
    }, 180);

    // 3) once the lid + base have finished moving away, remove the box
    setTimeout(() => {
      boxWrap.style.display = 'none';
    }, 950);
  }

  boxWrap.addEventListener('click', openBox);

  fillContent(deck[index], index + 1, deck.length);
  updatePrevState();
})();
</script>
</body>
</html>
